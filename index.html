<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>王予晟 · AI Builder 与视觉艺术作品集 · 第四版</title>
<style>
  :root{
    --paper:#F6F6F3;
    --card:#FFFFFF;
    --ink:#111114;
    --ink-soft:#3A3A40;
    --muted:#77777F;
    --faint:#A6A6AD;
    --line:#E7E7E1;
    --line-strong:#D8D8D1;
    --accent:#2540FF;
    --accent-ink:#1A2CB8;
    --accent-wash:rgba(37,64,255,.07);
    --dark:#111114;
    --radius:16px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    line-height:1.55;
  }
  .mono{font-family:var(--mono)}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    display:inline-flex;
    align-items:center;
    gap:.6em;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--line-strong)}

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;top:0;left:0;right:0;height:60px;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(18px,4vw,54px);
    background:rgba(246,246,243,.94);border-bottom:1px solid var(--line);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--ink)}
  .brand b{font-size:14px;font-weight:600;letter-spacing:.01em}
  .brand small{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  /* progress bar */
  .progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:50}
  .section-nav{
    position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:35;
    display:flex;flex-direction:column;align-items:center;padding:8px 3px;
    border:1px solid var(--line);border-radius:20px;
    background:rgba(255,255,255,.84);box-shadow:0 5px 20px rgba(17,17,20,.07);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
  }
  .section-nav button{
    display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;
    background:none;cursor:pointer
  }
  .section-nav button::before{
    content:"";width:7px;height:7px;border-radius:50%;
    background:var(--line-strong);transition:background .2s,transform .2s
  }
  .section-nav button:hover::before,.section-nav button:focus-visible::before{background:var(--accent);transform:scale(1.3)}
  .section-nav button.active::before{background:var(--accent);transform:scale(1.45)}
  .section-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-radius:50%}

  /* ---------- STAGE / SLIDES ---------- */
  .stage{position:relative;padding-top:60px}
  .slide{
    position:relative;
    padding:58px clamp(18px,4vw,54px) 76px;
    padding-right:clamp(44px,5vw,68px);
    scroll-margin-top:60px;
  }
  .slide + .slide{border-top:1px solid var(--line)}
  .slide:focus{outline:none}
  .wrap{width:100%;max-width:1220px;margin:0 auto}

  /* ---------- COVER ---------- */
  .cover{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,64px);align-items:center}
  .cover-l h1{
    line-height:1.14;letter-spacing:0;font-weight:640;
    margin:22px 0 20px;
  }
  .cover-l h1 span{display:block}
  .cover-title-main{font-size:62px}
  .cover-title-main em{font-style:normal;color:var(--accent)}
  .cover-title-line{font-size:40px}
  .cover-title-last{font-size:29px;color:var(--accent);margin-top:7px}
  .cover-lead{font-size:17px;color:var(--ink-soft);max-width:38ch}
  .cover-meta{margin-top:34px;display:flex;flex-direction:column;gap:10px}
  .cover-meta div{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-soft)}
  .cover-meta span.k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);width:74px;flex:none}
  .cover-personal{margin-top:20px;display:flex;flex-wrap:wrap;gap:5px 18px;font-size:12px;line-height:1.6;color:var(--muted)}
  .cover-index{margin:52px 0 12px;padding:18px 22px 14px;background:rgba(255,255,255,.76);border:1px solid rgba(216,216,209,.86);border-radius:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .cover-index-head{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
  .cover-index-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .cover-index-link{display:flex;flex-direction:column;gap:9px;width:100%;min-width:0;padding:0 0 12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:500 13px/1.38 var(--sans);transition:color .2s}
  .cover-index-link:hover,.cover-index-link:focus-visible{color:var(--accent-ink)}
  .cover-index-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cover-index-image{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;background:var(--card)}
  .cover-index-label{display:flex;align-items:flex-start;gap:9px;width:100%}
  .cover-index-link .n{flex:none;font:11px/1.6 var(--mono);color:var(--accent)}
  .cover-index-link .t{min-width:0;overflow-wrap:anywhere}
  .cover-index-more{display:flex;flex-wrap:wrap;gap:8px 22px;padding-top:12px}
  .cover-index-more button{border:0;background:none;color:var(--muted);font:12px var(--sans);cursor:pointer}
  .cover-index-more button:hover,.cover-index-more button:focus-visible{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
  .cover-r{position:relative}
  .cover-carousel{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card)}
  .cover-r img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);display:block;filter:saturate(1.02);transition:opacity .22s ease}
  .cover-r .frame{position:absolute;inset:0;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none;z-index:3}
  .cover-hit{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;cursor:pointer;z-index:2}
  .cover-hit.prev{left:0}
  .cover-hit.next{right:0}
  .cover-hit:focus-visible,.cover-arrow:focus-visible{outline:2px solid #fff;outline-offset:-5px}
  .cover-arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(255,255,255,.7);background:rgba(17,17,20,.48);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;cursor:pointer;transition:.2s;
    backdrop-filter:blur(5px)
  }
  .cover-arrow:hover{background:rgba(17,17,20,.72)}
  .cover-arrow.prev{left:12px}
  .cover-arrow.next{right:12px}
  .cover-dots{position:absolute;right:14px;bottom:14px;z-index:4;display:flex;gap:6px}
  .cover-dot{width:7px;height:7px;border:0;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer;padding:0;transition:.2s}
  .cover-dot.active{width:18px;border-radius:999px;background:#fff}
  .badge{
    position:absolute;left:-14px;bottom:22px;background:var(--dark);color:#fff;border-radius:12px;
    padding:12px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;line-height:1.5;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.5)
  }
  .badge b{color:#fff}
  .badge span{color:#9fa8ff}

  /* ---------- ABOUT ---------- */
  .home-background{margin-top:64px}
  .sec-head{max-width:760px}
  .sec-head h2{font-size:clamp(24px,3vw,38px);line-height:1.12;letter-spacing:-.015em;font-weight:620;margin:16px 0 14px}
  .sec-head p{color:var(--ink-soft);font-size:clamp(14px,1.4vw,16.5px)}
  .about-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
  .tl-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;transition:.25s}
  .tl-card:hover{border-color:var(--line-strong);transform:translateY(-3px);box-shadow:0 20px 40px -28px rgba(0,0,0,.35)}
  .tl-card span{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .tl-card h3{font-size:15px;font-weight:600;margin:12px 0 8px;line-height:1.35}
  .tl-card p{font-size:13px;color:var(--muted);line-height:1.55}
  .cap-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
  .chip{font-size:12.5px;color:var(--ink-soft);border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:7px 14px}
  .chip.hot{background:var(--dark);color:#fff;border-color:var(--dark)}
  .about-awards{margin-top:52px;border-top:1px solid var(--line-strong);padding-top:26px}
  .about-awards .sec-head{margin-bottom:18px}
  .award-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}
  .award-item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;min-height:66px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
  .award-logo{width:86px;height:42px;display:flex;align-items:center;justify-content:center}
  .award-logo img{display:block;max-width:100%;max-height:100%;object-fit:contain}
  .award-logo img.apple{width:38px;height:38px}
  .award-wordmark{font-size:19px;font-weight:700;color:#111;letter-spacing:0}
  .award-copy{min-width:0;line-height:1.35}
  .award-copy b{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
  .award-copy p{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .award-note{margin-top:10px;font-size:12px;color:var(--faint)}

  /* ---------- PROJECT ---------- */
  .p-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .p-meta{max-width:640px}
  .p-kind{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .p-kind i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
  .p-index{font-family:var(--mono);font-size:13px;color:var(--faint);letter-spacing:.1em}
  .p-title{font-size:clamp(23px,3vw,36px);line-height:1.1;letter-spacing:-.015em;font-weight:640;margin:12px 0 6px}
  .p-sub{font-size:15px;color:var(--accent-ink);font-weight:500;margin-bottom:14px}
  .p-intro{font-size:clamp(14px,1.35vw,16px);color:var(--ink-soft);max-width:70ch}
  .p-site-link{display:inline-flex;margin-top:12px;color:var(--accent-ink);font-size:13px;text-decoration:underline;text-underline-offset:3px}
  .p-method{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
  .p-method span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--card)}

  .media-bar{
    margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .media-bar .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .collapse-btn{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);
    border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;transition:.2s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .collapse-btn:hover{border-color:var(--ink);color:var(--ink)}
  .collapse-btn .ca{transition:transform .25s;display:inline-block}
  .media-wrap.collapsed .strip-group{display:none}
  .media-wrap.collapsed .collapse-btn .ca{transform:rotate(-90deg)}

  .strip-group{margin-top:18px}
  .group-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .group-head h4{font-size:15px;font-weight:600}
  .group-head p{font-size:13px;color:var(--muted)}
  .group-desc{font-size:13px;color:var(--ink-soft);max-width:92ch;margin:-3px 0 12px;line-height:1.65}
  .group-head .gv{
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--accent);cursor:pointer;
    border:1px solid var(--accent);border-radius:999px;padding:3px 11px;transition:.2s;background:var(--accent-wash);
  }
  .group-head .gv:hover{background:var(--accent);color:#fff}

  .strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
  .strip::-webkit-scrollbar{height:8px}
  .strip::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
  .thumb{
    position:relative;height:214px;flex:none;border-radius:12px;overflow:hidden;cursor:pointer;
    border:1px solid var(--line);background:var(--card);scroll-snap-align:start;transition:.25s;
  }
  .thumb:hover{transform:translateY(-4px);box-shadow:0 22px 44px -26px rgba(0,0,0,.4);border-color:var(--line-strong)}
  .thumb img{height:100%;width:auto;display:block;object-fit:cover}
  .thumb .cap{
    position:absolute;left:0;right:0;bottom:0;padding:16px 12px 9px;font-size:11.5px;color:#fff;
    background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0));opacity:0;transition:.25s;
  }
  .thumb:hover .cap{opacity:1}
  /* video tiles */
  .thumb.vid{width:320px;background:#0e0e12}
  .thumb.vid img{width:100%;height:100%;object-fit:cover;opacity:.62}
  .thumb.vid video.preview-video{width:100%;height:100%;display:block;object-fit:cover;opacity:.86}
  .thumb.vid .play{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;
  }
  .thumb.vid .play .ring{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
  .thumb.vid .play .ring::after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
  .thumb.vid .play .vlab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .thumb.vid .prov{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#c9cfff;text-transform:uppercase}

  .poster-strip .thumb{height:250px}
  .exhibit-strip .thumb{height:190px}

  .map-block{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px clamp(16px,2.4vw,30px)}
  .map-block .mh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .map-block .mh h4{font-size:16px;font-weight:600}
  .map-block .mh p{font-size:12.5px;color:var(--muted);max-width:50ch}
  .map-canvas{position:relative;width:100%;max-width:960px;margin:0 auto}
  .map-canvas img.world{width:100%;display:block;opacity:.9}
  .map-key{display:none}
  .flag{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%)}
  .flag i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block;box-shadow:0 0 0 4px var(--accent-wash);animation:pulse 2.6s infinite}
  .flag b{
    position:absolute;left:50%;top:-6px;transform:translate(calc(-50% + var(--lx,0px)),calc(-100% + var(--ly,0px)));
    white-space:nowrap;font-size:10.5px;font-weight:600;color:var(--ink);background:var(--card);
    border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px;box-shadow:0 6px 14px -8px rgba(0,0,0,.4)
  }
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-wash)}70%{box-shadow:0 0 0 9px rgba(37,64,255,0)}100%{box-shadow:0 0 0 0 rgba(37,64,255,0)}}

  .honor-grid{margin-top:26px}
  .honor-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .hpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .hpanel span.t{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .hpanel ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:9px}
  .hpanel li{font-size:13px;color:var(--ink-soft);padding-left:16px;position:relative;line-height:1.45}
  .hpanel li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--line-strong)}

  /* closing */
  .closing{min-height:calc(100svh - 194px);display:flex;flex-direction:column;justify-content:center}
  .closing h2{max-width:100%;font-size:clamp(34px,5.4vw,68px);line-height:1.12;font-weight:640}
  .closing h2 em{font-style:normal;color:var(--accent)}
  .closing-contact{margin-top:38px;display:flex;flex-wrap:wrap;gap:16px 30px}
  .closing a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:4px;font-size:clamp(16px,1.8vw,22px)}
  .closing a:hover{color:var(--accent-ink)}

  /* ---------- LIGHTBOX ---------- */
  .lb{position:fixed;inset:0;background:rgba(12,12,15,.94);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column}
  .lb.open{display:flex}
  body.lightbox-open{overflow:hidden}
  .lb-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:56px 68px 12px;min-height:0}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .lb-stage video{max-width:100%;max-height:100%;border-radius:8px;background:#000}
  .lb-stage .embed{position:relative;width:min(1100px,92vw);aspect-ratio:16/9;max-height:82vh}
  .lb-stage .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}
  .lb-cap{color:#d7d7de;font-size:13px;font-family:var(--mono);letter-spacing:.04em;padding:6px 20px 20px;text-align:center;min-height:20px}
  .lb-close{position:absolute;top:20px;right:24px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer;transition:.2s}
  .lb-close:hover{background:rgba(255,255,255,.16)}
  .lb-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#fff;font-size:22px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
  .lb-arrow:hover{background:rgba(255,255,255,.16)}
  .lb-arrow.prev{left:20px}.lb-arrow.next{right:20px}
  .lb-count{position:absolute;top:24px;left:26px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:#a9a9b4}

  @media(max-width:900px){
    .cover{grid-template-columns:1fr;gap:24px}
    .cover-index-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .about-grid{grid-template-columns:1fr 1fr}
    .p-top{flex-direction:column}
    .slide{padding:44px 42px 64px 18px}
  }
  @media(max-width:1100px){
    .award-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:620px){
    .cover-title-main{font-size:44px}
    .cover-title-line{font-size:30px}
    .cover-title-last{font-size:23px}
    .cover-lead{font-size:15px}
    .cover-index{padding:16px}
    .home-background{margin-top:48px}
    .about-grid{grid-template-columns:1fr}
    .cover-index-grid{gap:14px 12px}
    .cover-index-link{font-size:12.5px}
    .award-list{grid-template-columns:1fr}
    .honor-cols{grid-template-columns:1fr}
    .flag b{display:none}
    .map-key{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:12px;color:var(--muted);font-size:11px}
  }
  @media(max-width:360px){
    .cover-title-main{font-size:38px}
    .cover-title-line{font-size:26px}
    .cover-title-last{font-size:21px}
    .cover-index-grid{grid-template-columns:1fr}
  }
</style>
</head>

function thumbHTML(m, gi, mi){
  if(m.type==="video-local" || m.type==="video-embed"){
    const prov = m.provider ? `<span class="prov">${m.provider}</span>` : "";
    const preview = m.autoplayPreview
      ? `<video class="preview-video autoplay-preview" src="${m.src}" poster="${thumbSrc(m.poster)}" muted loop playsinline preload="none" aria-label="${m.label} 自动播放预览"></video>`
      : `<img src="${thumbSrc(m.poster)}" loading="lazy" decoding="async" alt="">`;
    const label = m.autoplayPreview ? "自动播放预览 · 点击查看完整视频" : (m.label||"播放视频");
    return `<div class="thumb vid" data-g="${gi}" data-m="${mi}">
      ${preview}${prov}
      <div class="play"><div class="ring"></div><div class="vlab">${label}</div></div>
    </div>`;
  }
  return `<div class="thumb" style="aspect-ratio:${thumbRatio(m.src)}" data-g="${gi}" data-m="${mi}">
      <img src="${thumbSrc(m.src)}" loading="lazy" decoding="async" alt="">
      <div class="cap">${m.cap||""}</div>
    </div>`;
}

function buildProject(s){
  // normalize into groups
  let groups;
  if(s.groups){ groups = s.groups; }
  else { groups = [{ name:null, images:s.media }]; }

  let stripHTML = groups.map((g,gi)=>{
    let items = [];
    if(g.video){ items.push({...g.video, type:"video-embed", label:"高清视频演示", cap:g.name}); }
    (g.images||[]).forEach(im=>items.push(im));
    const meta = g.meta ? `<p>${g.meta}</p>` : "";
    const desc = g.desc ? `<p class="group-desc">${g.desc}</p>` : "";
    const heads = g.name ? `<div class="group-head"><h4>${g.name}</h4>${meta}${g.video?`<span class="gv" data-g="${gi}" data-m="0">▶ 视频演示</span>`:""}</div>${desc}` : "";
    const thumbs = items.map((m,mi)=>thumbHTML(m,gi,mi)).join("");
    return `<div class="strip-group">${heads}<div class="strip">${thumbs}</div></div>`;
  }).join("");

  const method = (s.method||[]).map(x=>`<span>${x}</span>`).join("");

  return `<div class="wrap">
    <div class="p-top">
      <div class="p-meta">
        <div class="p-kind"><i></i>${s.kind}</div>
        <div class="p-title">${s.title}</div>
        <div class="p-sub">${s.sub}</div>
        <p class="p-intro">${s.intro}</p>
        ${method?`<div class="p-method">${method}</div>`:""}
        ${s.siteLink?`<a class="p-site-link" href="${s.siteLink}" target="_blank" rel="noopener noreferrer">打开 Home Pulse 交互演示 ↗</a>`:""}
      </div>
      <div class="p-index">${s.index}</div>
    </div>
    <div class="media-wrap">
      <div class="media-bar">
        <span class="lab">项目素材 · 点击放大 / 播放</span>
        <button class="collapse-btn"><span class="ca">▾</span> 收起 / 展开</button>
      </div>
      <div class="strip-groups">${stripHTML}</div>
    </div>
  </div>`;
}

    if(k===i) dot.setAttribute("aria-current","location");
    else dot.removeAttribute("aria-current");
  });
}

let coverIndex=0;
function setCover(i){
  coverIndex=(i+COVER_IMAGES.length)%COVER_IMAGES.length;
  const m=COVER_IMAGES[coverIndex];
  document.querySelectorAll("[data-cover-img]").forEach(img=>{
    img.src=m.src;
    img.alt=m.alt;
  });
  document.querySelectorAll(".cover-dot").forEach((d,k)=>d.classList.toggle("active",k===coverIndex));
  const next=new Image();
  next.src=COVER_IMAGES[(coverIndex+1)%COVER_IMAGES.length].src;
}
function stepCover(d){ setCover(coverIndex+d); }

function go(i,behavior="auto"){
  const target=Math.max(0,Math.min(total-1,i));
  const top=Math.max(0,slides[target].getBoundingClientRect().top+window.scrollY-60);
  const motion=window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : behavior;
  window.scrollTo({top,behavior:motion});
  slides[target].focus({preventScroll:true});
  try{ history.replaceState(null,"","#s="+target); }catch(e){}
}
const previewObserver=new IntersectionObserver(entries=>{
  entries.forEach(({target:video,isIntersecting})=>{
    if(isIntersecting && !document.getElementById("lb").classList.contains("open") && document.visibilityState==="visible") video.play().catch(()=>{});
    else video.pause();
  });
},{rootMargin:"80px",threshold:.2});
function syncPreviewVideos(){
  previewObserver.disconnect();
  document.querySelectorAll("video.autoplay-preview").forEach(video=>video.pause());
  document.querySelectorAll("video.autoplay-preview").forEach(video=>previewObserver.observe(video));
}
function updateScrollState(){
  const marker=window.scrollY+110;
  for(let i=total-1;i>=0;i--){
    if(slides[i].offsetTop<=marker){cur=i;break;}
  }
  setActiveDot(cur);
  const max=document.documentElement.scrollHeight-window.innerHeight;
  progress.style.width=(max>0 ? window.scrollY/max*100 : 100)+"%";
  if(location.hash!=="#s="+cur){
    try{ history.replaceState(null,"","#s="+cur); }catch(e){}
  }
}
let scrollFrame=0;
window.addEventListener("scroll",()=>{
  if(!scrollFrame) scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;updateScrollState();});
},{passive:true});
window.addEventListener("resize",updateScrollState);
window.addEventListener("hashchange",()=>{
  const match=location.hash.match(/s=(\d+)/);
  if(match) go(+match[1],"auto");
});
document.addEventListener("visibilitychange",syncPreviewVideos);

document.addEventListener("keydown",e=>{
  if(document.getElementById("lb").classList.contains("open")){
    if(e.key==="Escape") closeLB();
    if(e.key==="ArrowRight") lbStep(1);
    if(e.key==="ArrowLeft") lbStep(-1);
    return;
  }
});

/* cover carousel */
stage.addEventListener("click",e=>{
  const jump=e.target.closest("[data-jump]");
  if(jump){ go(Number(jump.dataset.jump)); return; }
  const step=e.target.closest("[data-cover-step]");
  if(step){
    e.preventDefault();
    stepCover(Number(step.dataset.coverStep));
    return;
  }
  const dot=e.target.closest("[data-cover-goto]");
  if(dot){
    e.preventDefault();
    setCover(Number(dot.dataset.coverGoto));
  }
});

/* collapse media */
stage.addEventListener("click",e=>{
  const cb=e.target.closest(".collapse-btn");
  if(cb){ cb.closest(".media-wrap").classList.toggle("collapsed"); }
});

/* ---------------- LIGHTBOX ---------------- */
const lb=document.getElementById("lb"), lbStage=document.getElementById("lbStage"),
      lbCap=document.getElementById("lbCap"), lbCount=document.getElementById("lbCount");
let lbList=[], lbIdx=0;

// build a per-slide media index lazily on click
function collectMedia(slideEl){
  const s=DECK[+slideEl.dataset.i];
  let list=[];
  if(s.type==="visual"){
    VISUAL_POSTERS.forEach(m=>list.push({kind:"img",src:m.src,cap:m.cap}));
    VISUAL_EXHIBITIONS.forEach(m=>list.push({kind:"img",src:m.src,cap:m.cap}));
    return list;
  }
  // project
  let groups = s.groups ? s.groups : [{images:s.media}];
  groups.forEach(g=>{
    if(g.video){ list.push({kind:"embed",src:g.video.src,provider:g.video.provider,cap:g.name||"视频演示"}); }
    (g.images||[]).forEach(m=>{
      if(m.type==="video-local") list.push({kind:"vlocal",src:m.src,cap:m.cap||m.label});
      else if(m.type==="video-embed") list.push({kind:"embed",src:m.src,provider:m.provider,cap:m.cap});
      else list.push({kind:"img",src:m.src,cap:m.cap});
    });
  });
  return list;
}

stage.addEventListener("click",e=>{
  const t=e.target.closest(".thumb, .gv");
  if(!t) return;
  const slideEl=t.closest(".slide");
  lbList=collectMedia(slideEl);
  const gi=+(t.dataset.g||0), mi=+(t.dataset.m||0);
  const s=DECK[+slideEl.dataset.i];
  const target=s.type==="visual" ? mi : flatIndex(s,gi,mi,t.classList.contains("gv"));
  openLB(target);
});

function flatIndex(s,gi,mi,isGV,isVid){
  let groups=s.groups?s.groups:[{images:s.media}];
  let flat=0;
  for(let ggi=0; ggi<groups.length; ggi++){
    const g=groups[ggi];
    const hasV=!!g.video;
    if(ggi<gi){
      flat += (hasV?1:0) + (g.images?g.images.length:0);
      continue;
    }
    // ggi === gi
    if(isGV){ return flat; } // the group video
    if(hasV){
      // thumbs order: video tile first (data-m=0), then images data-m=1..
      return flat + mi;
    } else {
      return flat + mi;
    }
  }
  return 0;
}

function renderLB(){
  const m=lbList[lbIdx];
  lbStage.innerHTML="";
  if(m.kind==="img"){
    const im=document.createElement("img"); im.src=m.src; lbStage.appendChild(im);
  } else if(m.kind==="vlocal"){
    const v=document.createElement("video"); v.src=m.src; v.controls=true; v.autoplay=true; v.playsInline=true; lbStage.appendChild(v);
  } else if(m.kind==="embed"){
    const d=document.createElement("div"); d.className="embed";
    const f=document.createElement("iframe"); f.src=m.src; f.allfullscreen=true; f.setAttribute("allowfullscreen","true"); f.setAttribute("allow","autoplay; fullscreen; picture-in-picture"); f.setAttribute("scrolling","no");
    d.appendChild(f); lbStage.appendChild(d);
  }
  lbCap.textContent=(m.cap||"")+(m.provider?"  ·  "+m.provider+" 高清演示":"");
  lbCount.textContent=(lbIdx+1)+" / "+lbList.length;
}
function openLB(i){
  document.querySelectorAll("video.autoplay-preview").forEach(video=>video.pause());
  lbIdx=i; lb.classList.add("open"); document.body.classList.add("lightbox-open"); renderLB();
}
function closeLB(){ lb.classList.remove("open"); document.body.classList.remove("lightbox-open"); lbStage.innerHTML=""; syncPreviewVideos(); }
function lbStep(d){ lbIdx=(lbIdx+d+lbList.length)%lbList.length; renderLB(); }
document.getElementById("lbClose").onclick=closeLB;
document.getElementById("lbPrev").onclick=()=>lbStep(-1);
document.getElementById("lbNext").onclick=()=>lbStep(1);
lb.addEventListener("click",e=>{ if(e.target===lb) closeLB(); });

const m0=location.hash.match(/s=(\d+)/);
setCover(0);
syncPreviewVideos();
requestAnimationFrame(()=>{
  if(m0) go(+m0[1],"auto");
  updateScrollState();
});
setInterval(()=>{
  const carousel=document.querySelector(".cover-carousel");
  if(!carousel || lb.classList.contains("open") || document.visibilityState!=="visible") return;
  const rect=carousel.getBoundingClientRect();
  if(rect.bottom>60 && rect.top<window.innerHeight) stepCover(1);
},5200);
</script>
